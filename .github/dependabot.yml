version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/harness"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
